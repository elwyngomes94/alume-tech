# Configuracao de referencia do Nginx como proxy reverso do JJA System.
# Documentos privados (private_media) NUNCA sao servidos por aqui -- apenas
# pela view autenticada do Django.

server {
    listen 80;
    server_name _;
    client_max_body_size 30M;

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
