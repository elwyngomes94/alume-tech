{% extends "base.html" %}

{% block title %}Painel de chamada - {{ active_clinic }}{% endblock %}

{% block body %}
<div class="jja-tv-panel">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0">{{ active_clinic }} - Painel de chamada</h1>
    <a href="{% url 'dashboard:reception' %}" class="btn btn-sm btn-outline-light">Sair do painel</a>
  </div>
  <div id="jjaTvSpotlight"></div>
  <div id="jjaTvGrid" class="row g-3">
    <div class="col-12 text-center opacity-75" id="jjaTvEmpty">Nenhuma senha chamada no momento.</div>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
(function () {
  "use strict";
  var STATUS_URL = "{% url 'calling:panel-status' %}";
  var seenCalled = {};
  //  Por quanto tempo o destaque grande (banner) e o anel piscando no
  //  card ficam ativos apos uma chamada nova, antes de "assentar" no
  //  visual normal de senha chamada (que continua ate ser atendida).
  var SPOTLIGHT_MS = 12000;
  var spotlightTicketId = null;
  var spotlightTimer = null;
  // A 1a resposta do polling so serve para saber o que ja estava chamado
  // quando o painel abriu -- nao pode disparar som/destaque para senhas
  // chamadas antes de a TV ser ligada.
  var hasRenderedOnce = false;

  function beep() {
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      // Duas notas (nao uma so) para chamar mais atencao numa sala de
      // espera com som ambiente.
      [660, 880].forEach(function (freq, index) {
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = "sine";
        osc.frequency.value = freq;
        var start = ctx.currentTime + index * 0.28;
        gain.gain.setValueAtTime(0.001, start);
        gain.gain.exponentialRampToValueAtTime(0.25, start + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.001, start + 0.45);
        osc.start(start);
        osc.stop(start + 0.5);
      });
    } catch (e) { /* sem suporte a audio no navegador da TV */ }
  }

  function renderSpotlight(ticket) {
    var el = document.getElementById("jjaTvSpotlight");
    if (!ticket) {
      el.innerHTML = "";
      return;
    }
    el.innerHTML =
      '<div class="jja-tv-spotlight">' +
      '<div class="jja-tv-spotlight-label">Chamando agora</div>' +
      '<div class="jja-tv-spotlight-ticket">' + ticket.label + "</div>" +
      '<div class="jja-tv-spotlight-detail">' + ticket.professional +
      (ticket.room ? " &middot; Sala " + ticket.room : "") + "</div>" +
      "</div>";
  }

  function render(data) {
    var grid = document.getElementById("jjaTvGrid");
    var empty = document.getElementById("jjaTvEmpty");
    grid.innerHTML = "";
    if (!data.tickets.length) {
      grid.appendChild(empty);
      renderSpotlight(null);
      spotlightTicketId = null;
      seenCalled = {};
      hasRenderedOnce = true;
      return;
    }
    // 1a passada: descobre se alguma senha acabou de ser chamada nesta
    // atualizacao -- precisa ser conhecido ANTES de montar os cards, para
    // o card certo ja nascer com o anel piscando (nao so na proxima
    // atualizacao, 3s depois).
    var currentIds = {};
    var justCalled = null;
    data.tickets.forEach(function (ticket) {
      currentIds[ticket.id] = true;
      if (hasRenderedOnce && ticket.status === "called" && !seenCalled[ticket.id]) {
        justCalled = ticket;
      }
    });

    if (justCalled) {
      if (data.sound_enabled) beep();
      spotlightTicketId = justCalled.id;
      renderSpotlight(justCalled);
      if (spotlightTimer) window.clearTimeout(spotlightTimer);
      spotlightTimer = window.setTimeout(function () {
        spotlightTicketId = null;
        renderSpotlight(null);
      }, SPOTLIGHT_MS);
    } else if (spotlightTicketId && !currentIds[spotlightTicketId]) {
      // A senha em destaque saiu da lista (foi atendida/cancelada) --
      // limpa o banner na hora, sem esperar o timer.
      spotlightTicketId = null;
      renderSpotlight(null);
      if (spotlightTimer) window.clearTimeout(spotlightTimer);
    }

    // 2a passada: monta os cards ja sabendo qual (se algum) e o destaque.
    data.tickets.forEach(function (ticket) {
      var col = document.createElement("div");
      col.className = "col-md-4";
      var card = document.createElement("div");
      var classes = "jja-tv-card" + (ticket.status === "called" ? " jja-tv-called" : "");
      if (ticket.id === spotlightTicketId) classes += " jja-tv-flash";
      card.className = classes;
      card.innerHTML =
        '<div class="jja-tv-ticket">' + ticket.label + "</div>" +
        '<div>' + ticket.professional + (ticket.room ? " &middot; Sala " + ticket.room : "") + "</div>";
      col.appendChild(card);
      grid.appendChild(col);
    });
    seenCalled = currentIds;
    hasRenderedOnce = true;
  }

  function poll() {
    fetch(STATUS_URL).then(function (r) { return r.json(); }).then(render).catch(function () {});
  }
  poll();
  setInterval(poll, 3000);
})();
</script>
{% endblock %}
