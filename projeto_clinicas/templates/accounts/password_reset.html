{% extends "layouts/auth.html" %}

{% block auth_title %}Recuperar acesso{% endblock %}
{% block auth_subtitle %}Informe seu e-mail e enviaremos um link seguro de redefinicao.{% endblock %}

{% block content %}
<form method="post" novalidate>
  {% csrf_token %}
  <div class="mb-3">
    <label class="form-label" for="{{ form.email.id_for_label }}">E-mail</label>
    <input type="email" name="email" id="{{ form.email.id_for_label }}" class="form-control" required autofocus>
  </div>
  <button class="btn btn-primary w-100" type="submit">Enviar link</button>
</form>
<div class="text-center mt-3"><a class="small" href="{% url 'accounts:login' %}">Voltar</a></div>
{% endblock %}
