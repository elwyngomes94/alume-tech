{% comment %}Filtros comuns as visualizacoes de agenda (dia/semana/mes/lista).{% endcomment %}
<form class="jja-filters d-flex flex-wrap gap-2 align-items-end" method="get">
  <div>
    <label class="form-label small mb-0">Profissional</label>
    <select class="form-select form-select-sm" name="professional" onchange="this.form.submit()">
      <option value="">Todos</option>
      {% for professional in professionals %}
        <option value="{{ professional.pk }}" {% if request.GET.professional == professional.pk|stringformat:"s" %}selected{% endif %}>
          {{ professional.display_name }}
        </option>
      {% endfor %}
    </select>
  </div>
  <div>
    <label class="form-label small mb-0">Data</label>
    <input class="form-control form-control-sm" type="date" name="date" value="{{ selected_date|date:'Y-m-d' }}"
           onchange="this.form.submit()">
  </div>
  <div>
    <label class="form-label small mb-0">Servico</label>
    <select class="form-select form-select-sm" name="service" onchange="this.form.submit()">
      <option value="">Todos</option>
      {% for item in services %}
        <option value="{{ item.pk }}" {% if request.GET.service == item.pk|stringformat:"s" %}selected{% endif %}>{{ item.name }}</option>
      {% endfor %}
    </select>
  </div>
  <div>
    <label class="form-label small mb-0">Sala</label>
    <select class="form-select form-select-sm" name="room" onchange="this.form.submit()">
      <option value="">Todas</option>
      {% for item in rooms %}
        <option value="{{ item.pk }}" {% if request.GET.room == item.pk|stringformat:"s" %}selected{% endif %}>{{ item.name }}</option>
      {% endfor %}
    </select>
  </div>
  <div>
    <label class="form-label small mb-0">Status</label>
    <select class="form-select form-select-sm" name="status" onchange="this.form.submit()">
      <option value="">Todos</option>
      {% for value, label in status_choices %}
        <option value="{{ value }}" {% if request.GET.status == value %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </div>
  <div>
    <label class="form-label small mb-0 d-block">&nbsp;</label>
    <div class="btn-group btn-group-sm" role="group">
      <a class="btn btn-outline-secondary {% if request.resolver_match.url_name != 'agenda-list' %}active{% endif %}"
         href="{% url 'scheduling:agenda-week' %}?date={{ selected_date|date:'Y-m-d' }}"><i class="bi bi-calendar3"></i> Agenda</a>
      <a class="btn btn-outline-secondary {% if request.resolver_match.url_name == 'agenda-list' %}active{% endif %}"
         href="{% url 'scheduling:agenda-list' %}"><i class="bi bi-list-ul"></i> Lista</a>
    </div>
  </div>
</form>
