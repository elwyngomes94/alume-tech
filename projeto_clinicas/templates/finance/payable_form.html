{% extends "layouts/app.html" %}

{% block page_title %}{% if form.instance.is_saved %}Editar conta a pagar{% else %}Nova conta a pagar{% endif %}{% endblock %}

{% block content %}
<div class="card">
  <div class="card-body">
    <form method="post" enctype="multipart/form-data" novalidate>
      {% csrf_token %}
      {% include "includes/form.html" with form=form %}
      <div class="mt-4 d-flex gap-2">
        <button class="btn btn-primary" type="submit">Salvar</button>
        <a class="btn btn-light" href="{% url 'finance:payable-list' %}">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
